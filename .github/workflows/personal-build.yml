name: Build my filtered phone app

# Builds the personal (news-free) NewPipe for phones and puts the APK on this
# repo's "Releases" page under the tag "latest".
#
# Runs on every push to master (including "Sync fork" on the master branch),
# or by hand from the Actions tab.
#
# Needs the same four repository secrets as the SmartTube copy
# (Settings > Secrets and variables > Actions):
#   SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-build
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'TeamNewPipe/NewPipe'
    runs-on: ubuntu-latest

    steps:
      - name: Check signing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SIGNING_KEY secret is missing. Add the four signing secrets first."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -DpackageSuffix=.personal "-DpersonalAppName=My Tube" -DversionNameSuffix=-personal --stacktrace

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/key.jks"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          mkdir -p out
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/key.jks" --ks-pass env:KEY_STORE_PASSWORD \
            --ks-key-alias "$ALIAS" --key-pass env:KEY_PASSWORD \
            --out out/MyTube-phone.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify out/MyTube-phone.apk
          VERSION_NAME="$(jq -r ".elements[0].versionName" "app/build/outputs/apk/release/output-metadata.json")"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: MyTube-phone-${{ env.VERSION_NAME }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --title "My Tube $VERSION_NAME" \
            --notes "Personal phone build with the news, politics, Shorts and adult-content filter." \
            --target "$GITHUB_SHA"
